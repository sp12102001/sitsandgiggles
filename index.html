<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>SITS & Giggles</title>
    <style>
        :root {
            /* Color palette */
            --bg: #ffffff;
            --card: #f6f7fb;
            --muted: #5a6475;
            --fg: #0e1320;
            --accent: #2b6aff;
            --ok: #1aa36f;
            --bad: #d93d52;
            --grid: #e7eaf3;
            --cell: #ffffff;
            --black: #cfd5e6;

            /* Design tokens */
            --shadow: 0 6px 18px rgba(5, 22, 58, .08);
            --radius: 14px;
            --mono: ui-monospace, Menlo, Consolas, monospace;
            --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
            font-family: var(--sans);
            color: var(--fg);
            background: var(--bg);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            border-bottom: 1px solid #e6e9f2;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: var(--fg);
        }

        .brand p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .hidden-label {
            display: none;
        }

        button,
        input[type="date"] {
            background: #fff;
            color: var(--fg);
            border: 1px solid #d7dcef;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(43, 106, 255, 0.12);
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #d7dcef;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
        }

        /* Main layout */
        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 24px;
            padding: 24px;
            flex: 1;
            min-height: 0;
        }

        /* Grid section */
        .grid-section {
            background: var(--card);
            border: 1px solid #e3e7f3;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .grid {
            --size: 42px;
            height: 100%;
            overflow: auto;
            min-height: 320px;
            border: 1px solid #e3e7f3;
            border-radius: 12px;
            background: var(--grid);
            padding: 12px;
        }

        .row {
            display: flex;
        }

        .cell {
            width: var(--size);
            height: var(--size);
            background: var(--cell);
            border: 1px solid #e3e7f3;
            position: relative;
            transition: all 0.2s ease;
        }

        .cell:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(43, 106, 255, 0.1);
        }

        .cell.black {
            background: var(--black);
        }

        .cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            text-transform: uppercase;
            color: #1b2340;
            font-weight: 800;
            font-size: 20px;
            text-align: center;
            caret-color: var(--accent);
            transition: all 0.2s ease;
        }

        .cell input:focus {
            background: rgba(43, 106, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(43, 106, 255, 0.2);
            border-radius: 4px;
        }

        .cell .number {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 11px;
            color: #8b93a7;
            font-weight: 600;
        }

        .cell.correct input {
            background: rgba(26, 163, 111, 0.12);
        }

        .cell.wrong input {
            background: rgba(217, 61, 82, 0.12);
        }

        .word-highlight {
            background: rgba(43, 106, 255, 0.15) !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 2px rgba(43, 106, 255, 0.3) !important;
        }

        .clue-item {
            transition: all 0.2s ease;
        }

        .clue-item:hover {
            background: rgba(43, 106, 255, 0.08);
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(43, 106, 255, 0.15);
        }

        .status-icon {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .clue-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 4px;
        }

        .grid-number-label {
            color: var(--accent);
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .share-status {
            min-width: 160px;
            align-self: center;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .share-status.error {
            color: var(--bad);
        }

        /* Clues section */
        .clues-section {
            background: var(--card);
            border: 1px solid #e3e7f3;
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        .clues-section h2 {
            margin: 0 0 12px 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--fg);
        }

        .clues-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            min-height: 0;
            margin-bottom: 0;
            flex: 1;
        }

        .clues-list {
            margin: 0;
            padding-left: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 600px;
            flex: 1;
        }

        .clues-container h3 {
            margin: 0 0 12px 0;
            color: #3b4258;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
        }

        .clues-list li {
            line-height: 1.5;
            cursor: pointer;
            padding: 12px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            margin-bottom: 4px;
            word-wrap: break-word;
            -webkit-hyphens: auto;
            hyphens: auto;
        }

        .clues-list li:hover {
            color: var(--accent);
            background: rgba(43, 106, 255, 0.08);
            transform: translateX(4px);
            box-shadow: 0 2px 8px rgba(43, 106, 255, 0.15);
        }

        .clue-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e6e9f2;
            flex-wrap: wrap;
        }

        .clue-controls button {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            font-size: 13px;
        }

        .direction-tag {
            font-family: var(--mono);
            font-size: 12px;
            color: #5a6475;
            border: 1px solid #d7dcef;
            padding: 2px 8px;
            border-radius: 8px;
            margin-left: 8px;
            background: #fff;
            font-weight: 500;
        }

        /* Footer */
        .footer {
            color: #5a6475;
            text-align: center;
            padding: 16px 24px;
            font-size: 14px;
            border-top: 1px solid #e6e9f2;
            background: #fafbfc;
        }

        /* Test results */
        .test-results {
            font-family: var(--mono);
            font-size: 13px;
            color: #3b4258;
            background: #fff;
            border: 1px dashed #d7dcef;
            border-radius: 10px;
            padding: 12px;
            margin: 16px 0;
        }

        .info-text {
            margin: 12px 0 0 0;
            color: #3b4258;
            font-size: 15px;
            line-height: 1.5;
            padding: 12px;
            background: rgba(43, 106, 255, 0.05);
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .error-message {
            color: #666;
            padding: 20px;
            text-align: center;
        }

        .grid-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .grid-controls button {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            font-size: 12px;
        }

        /* Responsive design */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                gap: 20px;
            }

            .grid-section {
                order: 2;
            }

            .clues-section {
                order: 1;
                max-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 16px;
                gap: 16px;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .controls {
                justify-content: center;
            }

            .clues-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .grid {
                --size: 36px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="brand">
            <h1>SITS & Giggles - Better than the New York Times</h1>
            <p id="dateLabel"></p>
            <div class="author-info">
                <span class="author-name">by Sanjana</span>
                <a href="https://github.com/sanju" class="github-link" target="_blank" rel="noopener noreferrer"
                    title="Visit Sanjana's GitHub profile">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                    </svg>
                </a>
            </div>
        </div>
        <div class="controls">
            <label class="toggle">
                <input type="checkbox" id="inlineCheck">
                <span>Inline validation</span>
            </label>
            <label for="datePick" class="hidden-label">Select date</label>
            <input type="date" id="datePick" title="Select date for crossword">
            <button id="loadDate">Load date</button>
            <button id="clear">Clear progress</button>
        </div>
    </header>

    <main class="main-container">
        <section class="grid-section">
            <div class="grid-controls">
                <button id="checkAll">Check all</button>
                <button id="revealWrong">Reveal wrong letters</button>
                <button id="revealWord">Reveal selected word</button>
                <button id="hintFirst">Hint: First letter</button>
                <button id="hintLast">Hint: Last letter</button>
                <button id="shareResults">Share results</button>
                <span id="shareStatus" class="share-status" aria-live="polite"></span>
            </div>
            <div id="grid" class="grid" role="grid" aria-label="Crossword grid"></div>
        </section>

        <section class="clues-section">
            <h2>Clues</h2>
            <p class="info-text">Type the SITS screen code. Digits are allowed. Examples: ACD, AA1. Each crossword uses
                a random selection from all available codes.</p>

            <div class="clues-container">
                <div>
                    <h3>Across</h3>
                    <ul id="across" class="clues-list"></ul>
                </div>
                <div>
                    <h3>Down</h3>
                    <ul id="down" class="clues-list"></ul>
                </div>
            </div>

        </section>
    </main>

    <footer class="footer">
        Crossword from SITS codes. Built by Sanjana
    </footer>

    <script>
        "use strict";

        // ===== Constants and Configuration =====
        const DATA_URL = 'data/sits-codes.json';
        let ITEMS = [];

        function normalizeItems(items) {
            return items.map(item => ({
                code: item.code.toUpperCase().trim(),
                answer: item.code.toUpperCase().trim().replace(/[^A-Z0-9]/g, ''),
                clue: item.func
            }));
        }

        async function loadItems() {
            const response = await fetch(DATA_URL);
            if (!response.ok) {
                throw new Error(`Unable to load crossword data: ${response.status} ${response.statusText}`);
            }

            ITEMS = normalizeItems(await response.json());
        }

        const DIR = { ACROSS: 0, DOWN: 1 };

        // ===== DOM Elements =====
        const E = {
            grid: document.getElementById('grid'),
            across: document.getElementById('across'),
            down: document.getElementById('down'),
            dateLabel: document.getElementById('dateLabel'),
            inlineCheck: document.getElementById('inlineCheck'),
            datePick: document.getElementById('datePick'),
            loadDate: document.getElementById('loadDate'),
            clearBtn: document.getElementById('clear'),
            checkAll: document.getElementById('checkAll'),
            revealWrong: document.getElementById('revealWrong'),
            revealWord: document.getElementById('revealWord'),
            hintFirst: document.getElementById('hintFirst'),
            hintLast: document.getElementById('hintLast'),
            shareResults: document.getElementById('shareResults'),
            shareStatus: document.getElementById('shareStatus')
        };

        // ===== Application State =====
        let STATE = {
            date: todayStr(),
            grid: null,
            nums: null,
            clues: null,
            placements: null,
            inline: false,
            activeDirection: 'across',
            selectedCell: null
        };

        // ===== Utility Functions =====
        function mulberry32(a) {
            return function () {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function seedFromDate(dateStr) {
            const n = Number(dateStr.replaceAll('-', ''));
            return mulberry32(n ^ 0x9E3779B9);
        }

        function todayStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const da = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${da}`;
        }

        function storageKey(dateStr) {
            return `sits-fixed9:${dateStr}`;
        }

        function setDateLabel(dateStr) {
            const d = new Date(dateStr + "T00:00:00");
            E.dateLabel.textContent = d.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            E.datePick.value = dateStr;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ===== Crossword Generation =====
        function createEmptyGrid(size) {
            return Array.from({ length: size }, () =>
                Array.from({ length: size }, () => null)
            );
        }

        function canPlace(grid, word, row, col, dir) {
            const N = grid.length;
            const L = word.length;

            if (dir === DIR.ACROSS) {
                if (col + L > N) return false;
                if (col > 0 && grid[row][col - 1] && grid[row][col - 1] !== '#') return false;
                if (col + L < N && grid[row][col + L] && grid[row][col + L] !== '#') return false;

                for (let k = 0; k < L; k++) {
                    const r = row, c = col + k;
                    const cell = grid[r][c];

                    if (cell && cell !== word[k]) return false;
                    if (!cell) {
                        if (r > 0 && grid[r - 1][c] && grid[r - 1][c] !== '#') return false;
                        if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c] !== '#') return false;
                    }
                }
                return true;
            } else {
                if (row + L > N) return false;
                if (row > 0 && grid[row - 1][col] && grid[row - 1][col] !== '#') return false;
                if (row + L < N && grid[row + L][col] && grid[row + L][col] !== '#') return false;

                for (let k = 0; k < L; k++) {
                    const r = row + k, c = col;
                    const cell = grid[r][c];

                    if (cell && cell !== word[k]) return false;
                    if (!cell) {
                        if (c > 0 && grid[r][c - 1] && grid[r][c - 1] !== '#') return false;
                        if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1] !== '#') return false;
                    }
                }
                return true;
            }
        }

        function placeWord(grid, word, row, col, dir) {
            const positions = [];
            if (dir === DIR.ACROSS) {
                for (let k = 0; k < word.length; k++) {
                    if (!grid[row][col + k]) {
                        grid[row][col + k] = word[k];
                        positions.push([row, col + k]);
                    }
                }
            } else {
                for (let k = 0; k < word.length; k++) {
                    if (!grid[row + k][col]) {
                        grid[row + k][col] = word[k];
                        positions.push([row + k, col]);
                    }
                }
            }
            return positions;
        }

        function removePositions(grid, positions) {
            for (const [r, c] of positions) {
                grid[r][c] = null;
            }
        }

        function shuffle(array, rng) {
            const arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function findAnchors(grid, word) {
            const N = grid.length;
            const anchors = [];

            // Find crossing anchors
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const cell = grid[r][c];
                    if (!cell || cell === "#") continue;

                    for (let i = 0; i < word.length; i++) {
                        if (word[i] !== cell) continue;

                        // Check across placement
                        const startColAcross = c - i;
                        if (startColAcross >= 0 && canPlace(grid, word, r, startColAcross, DIR.ACROSS)) {
                            anchors.push({
                                row: r,
                                col: startColAcross,
                                dir: DIR.ACROSS,
                                cross: true
                            });
                        }

                        // Check down placement
                        const startRowDown = r - i;
                        if (startRowDown >= 0 && canPlace(grid, word, startRowDown, c, DIR.DOWN)) {
                            anchors.push({
                                row: startRowDown,
                                col: c,
                                dir: DIR.DOWN,
                                cross: true
                            });
                        }
                    }
                }
            }

            // If no crossing anchors found, find empty placements
            if (!anchors.length) {
                for (let r = 0; r < N; r++) {
                    for (let c = 0; c < N; c++) {
                        if (canPlace(grid, word, r, c, DIR.ACROSS)) {
                            anchors.push({ row: r, col: c, dir: DIR.ACROSS, cross: false });
                        }
                        if (canPlace(grid, word, r, c, DIR.DOWN)) {
                            anchors.push({ row: r, col: c, dir: DIR.DOWN, cross: false });
                        }
                    }
                }
            }

            // Sort by crossing priority
            return anchors.sort((a, b) => (b.cross ? 1 : 0) - (a.cross ? 1 : 0));
        }

        function fillBlacks(grid) {
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid.length; c++) {
                    if (grid[r][c] === null) {
                        grid[r][c] = '#';
                    }
                }
            }
        }

        function numberGrid(grid) {
            const N = grid.length;
            const numbers = Array.from({ length: N }, () => Array(N).fill(null));
            let counter = 1;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (grid[r][c] === '#') continue;

                    const isAcrossStart = (c === 0 || grid[r][c - 1] === '#') &&
                        (c + 1 < N && grid[r][c + 1] !== '#');
                    const isDownStart = (r === 0 || grid[r - 1][c] === '#') &&
                        (r + 1 < N && grid[r + 1][c] !== '#');

                    if (isAcrossStart || isDownStart) {
                        numbers[r][c] = counter++;
                    }
                }
            }

            return numbers;
        }

        function generate(entries, rng) {
            // Select a subset of items for the crossword (max 12 items for reasonable size)
            const maxItems = Math.min(12, Math.max(6, entries.length));
            const selectedItems = shuffle(entries.slice(), rng).slice(0, maxItems);

            const maxLen = Math.max(...selectedItems.map(e => e.answer.length));
            const baseSize = Math.min(12, Math.max(8, maxLen + 2));

            for (let size = baseSize; size <= 15; size++) {
                const grid = createEmptyGrid(size);
                const ordered = shuffle(
                    selectedItems.slice().sort((a, b) => b.answer.length - a.answer.length),
                    rng
                );

                // Place first word in center
                const first = ordered[0].answer;
                const startRow = Math.floor(size / 2);
                const startCol = Math.floor((size - first.length) / 2);

                if (!canPlace(grid, first, startRow, startCol, DIR.ACROSS)) continue;

                const placements = [{
                    entry: ordered[0],
                    row: startRow,
                    col: startCol,
                    dir: DIR.ACROSS,
                    positions: placeWord(grid, first, startRow, startCol, DIR.ACROSS)
                }];

                const rest = ordered.slice(1);

                function backtrack(index) {
                    if (index >= rest.length) return true;

                    const word = rest[index].answer;
                    const anchors = shuffle(findAnchors(grid, word), rng);

                    for (const anchor of anchors) {
                        const positions = placeWord(grid, word, anchor.row, anchor.col, anchor.dir);
                        placements.push({
                            entry: rest[index],
                            row: anchor.row,
                            col: anchor.col,
                            dir: anchor.dir,
                            positions: positions
                        });

                        if (backtrack(index + 1)) return true;

                        placements.pop();
                        removePositions(grid, positions);
                    }

                    return false;
                }

                if (backtrack(0)) {
                    fillBlacks(grid);
                    return { grid, placements };
                }
            }

            // If we can't fit all selected items, try with fewer items
            if (selectedItems.length > 6) {
                return generate(selectedItems.slice(0, Math.floor(selectedItems.length * 0.7)), rng);
            }

            // Last resort: create a simple grid with just a few items
            const simpleItems = selectedItems.slice(0, 4);
            const simpleGrid = createEmptyGrid(8);
            const simplePlacements = [];

            // Place items in a simple pattern
            for (let i = 0; i < simpleItems.length && i < 4; i++) {
                const item = simpleItems[i];
                const row = 2 + i;
                const col = 2;

                if (canPlace(simpleGrid, item.answer, row, col, DIR.ACROSS)) {
                    placeWord(simpleGrid, item.answer, row, col, DIR.ACROSS);
                    simplePlacements.push({
                        entry: item,
                        row: row,
                        col: col,
                        dir: DIR.ACROSS,
                        positions: []
                    });
                }
            }

            fillBlacks(simpleGrid);
            return { grid: simpleGrid, placements: simplePlacements };
        }

        // ===== UI Rendering =====
        function renderGrid() {
            E.grid.replaceChildren();
            const { grid, nums } = STATE;

            grid.forEach((row, rowIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';

                row.forEach((cell, colIndex) => {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';

                    if (cell === '#') {
                        cellEl.classList.add('black');
                    } else {
                        if (nums[rowIndex][colIndex]) {
                            const numEl = document.createElement('div');
                            numEl.className = 'number';
                            numEl.textContent = nums[rowIndex][colIndex];
                            cellEl.appendChild(numEl);
                        }

                        const input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.row = rowIndex;
                        input.dataset.col = colIndex;

                        input.addEventListener('input', handleInput);
                        input.addEventListener('keydown', handleKeydown);
                        input.addEventListener('focus', () => {
                            rememberSelectedCell(rowIndex, colIndex);
                            highlightCurrentWord(rowIndex, colIndex, STATE.activeDirection);
                        });

                        cellEl.appendChild(input);
                    }

                    rowEl.appendChild(cellEl);
                });

                E.grid.appendChild(rowEl);
            });
        }

        function buildClues() {
            const { grid, nums, placements } = STATE;
            const N = grid.length;
            const placedAnswers = new Set(placements.map(p => p.entry.answer));

            const across = [];
            const down = [];

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (grid[r][c] === '#' || !nums[r][c]) continue;

                    // Check across
                    if ((c === 0 || grid[r][c - 1] === '#') && (c + 1 < N && grid[r][c + 1] !== '#')) {
                        let col = c;
                        let answer = '';

                        while (col < N && grid[r][col] !== '#') {
                            answer += grid[r][col];
                            col++;
                        }

                        if (placedAnswers.has(answer)) {
                            const entry = placements.find(p => p.entry.answer === answer).entry;
                            across.push({
                                num: nums[r][c],
                                answer: answer,
                                clue: entry.clue,
                                len: answer.length,
                                row: r,
                                col: c,
                                code: entry.code
                            });
                        }
                    }

                    // Check down
                    if ((r === 0 || grid[r - 1][c] === '#') && (r + 1 < N && grid[r + 1][c] !== '#')) {
                        let row = r;
                        let answer = '';

                        while (row < N && grid[row][c] !== '#') {
                            answer += grid[row][c];
                            row++;
                        }

                        if (placedAnswers.has(answer)) {
                            const entry = placements.find(p => p.entry.answer === answer).entry;
                            down.push({
                                num: nums[r][c],
                                answer: answer,
                                clue: entry.clue,
                                len: answer.length,
                                row: r,
                                col: c,
                                code: entry.code
                            });
                        }
                    }
                }
            }

            across.sort((a, b) => a.num - b.num);
            down.sort((a, b) => a.num - b.num);

            return { across, down };
        }

        function renderClues() {
            function createClueItem(clue, direction) {
                const li = document.createElement('li');

                // Check word completion status
                const wordStatus = getWordStatus(clue, direction);
                const statusIcon = getStatusIcon(wordStatus);

                const content = document.createElement('div');
                content.className = 'clue-item-content';

                const labelEl = document.createElement('strong');
                labelEl.className = 'clue-label';

                const gridNumber = document.createElement('span');
                gridNumber.className = 'grid-number-label';
                gridNumber.textContent = `Grid ${clue.num}${direction.charAt(0)}`;

                const length = document.createElement('span');
                length.textContent = `— ${clue.len} letters:`;

                labelEl.append(gridNumber, ' ', length);

                const clueText = document.createElement('span');
                clueText.className = 'clue-text';
                clueText.textContent = clue.clue;

                const status = document.createElement('span');
                status.className = 'status-icon clue-status-icon';
                status.textContent = statusIcon;

                content.append(labelEl, ' ', clueText, ' ', status);
                li.appendChild(content);

                li.title = `Grid square ${clue.num}, ${direction}. Click to highlight word.`;
                li.addEventListener('click', () => highlightWord(clue, direction));
                li.classList.add('clue-item');
                li.dataset.clueNum = clue.num;
                li.dataset.direction = direction;

                return li;
            }

            E.across.replaceChildren();
            E.down.replaceChildren();

            STATE.clues.across.forEach(clue =>
                E.across.appendChild(createClueItem(clue, 'Across'))
            );
            STATE.clues.down.forEach(clue =>
                E.down.appendChild(createClueItem(clue, 'Down'))
            );
        }

        // ===== Input and Navigation =====
        function handleInput(event) {
            const input = event.target;
            const row = +input.dataset.row;
            const col = +input.dataset.col;
            rememberSelectedCell(row, col);

            input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 1);

            if (STATE.inline) {
                validateCell(input);
            }

            saveProgress();
            setShareStatus('');
            updateClueStatus(); // Update clue status indicators

            // Auto-advance to next cell when typing (immediate, no delay)
            if (input.value) {
                moveToNextCell(row, col, STATE.activeDirection === 'down' ? 'down' : 'right');
            }
        }

        function handleKeydown(event) {
            const input = event.target;
            const row = +input.dataset.row;
            const col = +input.dataset.col;
            const N = STATE.grid.length;

            // Handle arrow key navigation
            if (event.key === 'ArrowRight') {
                event.preventDefault();
                moveToNextCell(row, col, 'right');
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                moveToNextCell(row, col, 'left');
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                moveToNextCell(row, col, 'down');
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                moveToNextCell(row, col, 'up');
            } else if (event.key === 'Backspace' && !input.value) {
                event.preventDefault();
                moveToNextCell(row, col, 'left');
            } else if (event.key === 'Tab') {
                event.preventDefault();
                moveToNextWord(row, col, event.shiftKey);
            } else if (event.key === 'Delete') {
                // Clear current cell and move right
                event.preventDefault();
                input.value = '';
                input.parentElement.classList.remove('correct', 'wrong');
                saveProgress();
                updateClueStatus();
                moveToNextCell(row, col, 'right');
            } else if (event.key === 'Enter') {
                event.preventDefault();
                moveToNextWord(row, col, false);
            } else if (event.key === ' ') {
                event.preventDefault();
                toggleDirection(row, col);
            }
        }

        function focusCell(row, col, direction = STATE.activeDirection) {
            const input = getCellInput(row, col);
            if (input) {
                STATE.activeDirection = direction;
                rememberSelectedCell(row, col);
                input.focus();
                input.select();
                highlightCurrentWord(row, col, direction);
            }
        }

        function rememberSelectedCell(row, col) {
            STATE.selectedCell = { row, col };
        }

        function getCellInput(row, col) {
            return E.grid.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
        }

        function getSelectedInput() {
            const active = document.activeElement;

            if (active && active.tagName === 'INPUT' && active.dataset.row !== undefined) {
                return active;
            }

            if (!STATE.selectedCell) {
                return getInputs()[0] || null;
            }

            return getCellInput(STATE.selectedCell.row, STATE.selectedCell.col);
        }

        function moveToNextWord(currentRow, currentCol, reverse = false) {
            const { grid, nums } = STATE;
            const allWords = [];

            // Collect all word starting positions
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid.length; c++) {
                    if (grid[r][c] === '#' || !nums[r][c]) continue;

                    // Check if this is a word start
                    const isAcrossStart = (c === 0 || grid[r][c - 1] === '#') &&
                        (c + 1 < grid.length && grid[r][c + 1] !== '#');
                    const isDownStart = (r === 0 || grid[r - 1][c] === '#') &&
                        (r + 1 < grid.length && grid[r + 1][c] !== '#');

                    if (isAcrossStart) allWords.push({ row: r, col: c, dir: 'across', num: nums[r][c] });
                    if (isDownStart) allWords.push({ row: r, col: c, dir: 'down', num: nums[r][c] });
                }
            }

            // Sort by number
            allWords.sort((a, b) => a.num - b.num);

            const currentRange = findWordRange(currentRow, currentCol, STATE.activeDirection);

            // Find current word, even when focus is in the middle of a word.
            const currentWordIndex = allWords.findIndex(word => {
                if (!currentRange) return word.row === currentRow && word.col === currentCol;

                const rangeDir = currentRange.dir === 'A' ? 'across' : 'down';
                const rangeRow = currentRange.dir === 'A' ? currentRange.row : currentRange.startRow;
                const rangeCol = currentRange.dir === 'A' ? currentRange.startCol : currentRange.col;

                return word.dir === rangeDir && word.row === rangeRow && word.col === rangeCol;
            });

            if (currentWordIndex === -1) return;

            // Get next word
            let nextIndex;
            if (reverse) {
                nextIndex = currentWordIndex > 0 ? currentWordIndex - 1 : allWords.length - 1;
            } else {
                nextIndex = currentWordIndex < allWords.length - 1 ? currentWordIndex + 1 : 0;
            }

            const nextWord = allWords[nextIndex];
            STATE.activeDirection = nextWord.dir;
            focusCell(nextWord.row, nextWord.col, nextWord.dir);
        }

        function toggleDirection(row, col) {
            const { grid } = STATE;

            // Check if current cell is part of both across and down words
            const hasAcross = (col > 0 && grid[row][col - 1] !== '#') ||
                (col + 1 < grid.length && grid[row][col + 1] !== '#');
            const hasDown = (row > 0 && grid[row - 1][col] !== '#') ||
                (row + 1 < grid.length && grid[row + 1][col] !== '#');

            if (hasAcross && hasDown) {
                STATE.activeDirection = STATE.activeDirection === 'across' ? 'down' : 'across';
                highlightCurrentWord(row, col, STATE.activeDirection);
            }
        }

        function highlightCurrentWord(row, col, direction = STATE.activeDirection) {
            const range = findWordRange(row, col, direction);
            if (range) {
                highlightWordByRange(range);
            }
        }

        function highlightWordByRange(range) {
            clearHighlights();

            const cells = [];
            if (range.dir === 'A') {
                for (let c = range.startCol; c <= range.endCol; c++) {
                    cells.push({ row: range.row, col: c });
                }
            } else {
                for (let r = range.startRow; r <= range.endRow; r++) {
                    cells.push({ row: r, col: range.col });
                }
            }

            cells.forEach(({ row, col }) => {
                const cell = E.grid.querySelector(`input[data-row="${row}"][data-col="${col}"]`)?.parentElement;
                if (cell) {
                    cell.classList.add('word-highlight');
                }
            });
        }

        function moveToNextCell(currentRow, currentCol, direction) {
            const N = STATE.grid.length;
            let newRow = currentRow;
            let newCol = currentCol;

            if (direction === 'left' || direction === 'right') {
                STATE.activeDirection = 'across';
            } else if (direction === 'up' || direction === 'down') {
                STATE.activeDirection = 'down';
            }

            switch (direction) {
                case 'right':
                    for (let c = currentCol + 1; c < N; c++) {
                        if (STATE.grid[currentRow][c] !== '#') {
                            newCol = c;
                            break;
                        }
                    }
                    break;
                case 'left':
                    for (let c = currentCol - 1; c >= 0; c--) {
                        if (STATE.grid[currentRow][c] !== '#') {
                            newCol = c;
                            break;
                        }
                    }
                    break;
                case 'down':
                    for (let r = currentRow + 1; r < N; r++) {
                        if (STATE.grid[r][currentCol] !== '#') {
                            newRow = r;
                            break;
                        }
                    }
                    break;
                case 'up':
                    for (let r = currentRow - 1; r >= 0; r--) {
                        if (STATE.grid[r][currentCol] !== '#') {
                            newRow = r;
                            break;
                        }
                    }
                    break;
            }

            // If we found a valid cell, focus it
            if (newRow !== currentRow || newCol !== currentCol) {
                const nextInput = E.grid.querySelector(`input[data-row="${newRow}"][data-col="${newCol}"]`);
                if (nextInput) {
                    nextInput.focus();
                    highlightCurrentWord(newRow, newCol, STATE.activeDirection);
                    // Clear the next cell if it has content (for easy retyping)
                    if (nextInput.value) {
                        nextInput.select();
                    }
                }
            }
        }

        function smartMoveNext(event) {
            const input = event.target;
            const row = +input.dataset.row;
            const col = +input.dataset.col;
            const N = STATE.grid.length;

            // Try moving right
            for (let c = col + 1; c < N; c++) {
                if (STATE.grid[row][c] === '#') break;
                const next = E.grid.querySelector(`input[data-row="${row}"][data-col="${c}"]`);
                if (next && !next.value) {
                    next.focus();
                    return;
                }
            }

            // Try moving down and left
            for (let r = row + 1; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (STATE.grid[r][c] === '#') continue;
                    const next = E.grid.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    if (next && !next.value) {
                        next.focus();
                        return;
                    }
                }
            }
        }

        function smartMovePrev(event) {
            const input = event.target;
            const row = +input.dataset.row;
            const col = +input.dataset.col;
            const N = STATE.grid.length;

            // Try moving left
            for (let c = col - 1; c >= 0; c--) {
                if (STATE.grid[row][c] === '#') break;
                const prev = E.grid.querySelector(`input[data-row="${row}"][data-col="${c}"]`);
                if (prev) {
                    prev.focus();
                    return;
                }
            }

            // Try moving up and right
            for (let r = row - 1; r >= 0; r--) {
                for (let c = N - 1; c >= 0; c--) {
                    if (STATE.grid[r][c] === '#') continue;
                    const prev = E.grid.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    if (prev) {
                        prev.focus();
                        return;
                    }
                }
            }
        }

        // ===== Word Status and Highlighting =====
        function getWordStatus(clue, direction) {
            const { grid } = STATE;
            if (!grid || !clue) return 'empty'; // Safety check

            const isAcross = direction.toLowerCase() === 'across';
            let currentWord = '';

            if (isAcross) {
                for (let c = clue.col; c < grid.length && grid[clue.row][c] !== '#'; c++) {
                    const input = E.grid.querySelector(`input[data-row="${clue.row}"][data-col="${c}"]`);
                    currentWord += input ? input.value.toUpperCase() : '';
                }
            } else {
                for (let r = clue.row; r < grid.length && grid[r][clue.col] !== '#'; r++) {
                    const input = E.grid.querySelector(`input[data-row="${r}"][data-col="${clue.col}"]`);
                    currentWord += input ? input.value.toUpperCase() : '';
                }
            }

            if (currentWord.length === 0) return 'empty';
            if (currentWord === clue.answer) return 'complete';
            if (currentWord.length === clue.answer.length) return 'wrong';
            return 'partial';
        }

        function getStatusIcon(status) {
            switch (status) {
                case 'complete': return '✓';
                case 'partial': return '⚠️';
                case 'wrong': return '❌';
                case 'empty': return '○';
                default: return '';
            }
        }

        function highlightWord(clue, direction) {
            // Clear previous highlights
            clearHighlights();

            const { grid } = STATE;
            const isAcross = direction.toLowerCase() === 'across';
            STATE.activeDirection = isAcross ? 'across' : 'down';
            const cells = [];

            if (isAcross) {
                for (let c = clue.col; c < grid.length && grid[clue.row][c] !== '#'; c++) {
                    cells.push({ row: clue.row, col: c });
                }
            } else {
                for (let r = clue.row; r < grid.length && grid[r][clue.col] !== '#'; r++) {
                    cells.push({ row: r, col: clue.col });
                }
            }

            // Add highlight class to cells
            cells.forEach(({ row, col }) => {
                const cell = E.grid.querySelector(`input[data-row="${row}"][data-col="${col}"]`)?.parentElement;
                if (cell) {
                    cell.classList.add('word-highlight');
                }
            });

            // Focus first empty cell or first cell
            const firstEmpty = cells.find(({ row, col }) => {
                const input = E.grid.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
                return input && !input.value;
            });

            const targetCell = firstEmpty || cells[0];
            if (targetCell) {
                focusCell(targetCell.row, targetCell.col, STATE.activeDirection);
            }
        }

        function clearHighlights() {
            E.grid.querySelectorAll('.word-highlight').forEach(cell => {
                cell.classList.remove('word-highlight');
            });
        }

        function updateClueStatus() {
            // Update status icons for all clues
            if (!STATE.clues) return; // Safety check

            [...E.across.querySelectorAll('.clue-item'), ...E.down.querySelectorAll('.clue-item')].forEach(item => {
                const clueNum = parseInt(item.dataset.clueNum);
                const direction = item.dataset.direction.toLowerCase();

                // Find the clue data
                const clues = direction === 'across' ? STATE.clues.across : STATE.clues.down;
                const clue = clues.find(c => c.num === clueNum);

                if (clue) {
                    const status = getWordStatus(clue, direction);
                    const statusIcon = getStatusIcon(status);
                    const iconElement = item.querySelector('.status-icon');
                    if (iconElement) {
                        iconElement.textContent = statusIcon;
                    }
                }
            });
        }

        // ===== Validation =====
        function getAnswerMap() {
            const map = new Map();
            const { grid } = STATE;

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid.length; c++) {
                    const cell = grid[r][c];
                    if (cell && cell !== '#') {
                        map.set(`${r},${c}`, cell);
                    }
                }
            }

            return map;
        }

        function validateCell(input) {
            const key = `${input.dataset.row},${input.dataset.col}`;
            const expected = getAnswerMap().get(key);
            const value = input.value.toUpperCase();
            const cell = input.parentElement;

            cell.classList.remove('correct', 'wrong');

            if (!value) return;

            if (value === expected) {
                cell.classList.add('correct');
            } else {
                cell.classList.add('wrong');
            }
        }

        function validateAll(markBlanks = false) {
            const answerMap = getAnswerMap();

            for (const input of getInputs()) {
                const value = input.value.toUpperCase();
                const cell = input.parentElement;
                const key = `${input.dataset.row},${input.dataset.col}`;

                cell.classList.remove('correct', 'wrong');

                if (!value && !markBlanks) continue;

                if (value === answerMap.get(key)) {
                    cell.classList.add('correct');
                } else {
                    cell.classList.add('wrong');
                }
            }

            updateClueStatus();
        }

        function revealWrong() {
            const answerMap = getAnswerMap();

            for (const input of getInputs()) {
                const key = `${input.dataset.row},${input.dataset.col}`;
                const expected = answerMap.get(key);

                if (input.value && input.value.toUpperCase() !== expected) {
                    input.value = expected;
                    input.parentElement.classList.add('correct');
                    input.parentElement.classList.remove('wrong');
                }
            }

            saveProgress();
            updateClueStatus();
        }

        function revealCurrentWord() {
            const active = getSelectedInput();
            if (!active) return;

            const row = +active.dataset.row;
            const col = +active.dataset.col;
            const { grid } = STATE;
            const range = findWordRange(row, col, STATE.activeDirection);

            if (!range) return;

            if (range.dir === 'A') {
                for (let c = range.startCol; c <= range.endCol; c++) {
                    const input = E.grid.querySelector(`input[data-row="${range.row}"][data-col="${c}"]`);
                    const expected = grid[range.row][c];

                    if (input) {
                        input.value = expected;
                        input.parentElement.classList.add('correct');
                        input.parentElement.classList.remove('wrong');
                    }
                }
            } else {
                for (let r = range.startRow; r <= range.endRow; r++) {
                    const input = E.grid.querySelector(`input[data-row="${r}"][data-col="${range.col}"]`);
                    const expected = grid[r][range.col];

                    if (input) {
                        input.value = expected;
                        input.parentElement.classList.add('correct');
                        input.parentElement.classList.remove('wrong');
                    }
                }
            }

            saveProgress();
            updateClueStatus();
        }

        function hintFirstLetter() {
            const active = getSelectedInput();
            if (!active) return;

            const row = +active.dataset.row;
            const col = +active.dataset.col;
            const { grid } = STATE;

            // Find the word containing this cell
            let range = findWordRange(row, col, STATE.activeDirection);
            if (!range) return;

            const firstCell = range.dir === 'A'
                ? E.grid.querySelector(`input[data-row="${range.row}"][data-col="${range.startCol}"]`)
                : E.grid.querySelector(`input[data-row="${range.startRow}"][data-col="${range.col}"]`);

            if (firstCell) {
                const expected = range.dir === 'A' ? grid[range.row][range.startCol] : grid[range.startRow][range.col];

                if (firstCell.value.toUpperCase() !== expected) {
                    firstCell.value = expected;
                    firstCell.parentElement.classList.add('correct');
                    firstCell.parentElement.classList.remove('wrong');
                    saveProgress();
                    updateClueStatus();
                }
            }
        }

        function hintLastLetter() {
            const active = getSelectedInput();
            if (!active) return;

            const row = +active.dataset.row;
            const col = +active.dataset.col;
            const { grid } = STATE;

            // Find the word containing this cell
            let range = findWordRange(row, col, STATE.activeDirection);
            if (!range) return;

            const lastCell = range.dir === 'A'
                ? E.grid.querySelector(`input[data-row="${range.row}"][data-col="${range.endCol}"]`)
                : E.grid.querySelector(`input[data-row="${range.endRow}"][data-col="${range.col}"]`);

            if (lastCell) {
                const expected = range.dir === 'A' ? grid[range.row][range.endCol] : grid[range.endRow][range.col];

                if (lastCell.value.toUpperCase() !== expected) {
                    lastCell.value = expected;
                    lastCell.parentElement.classList.add('correct');
                    lastCell.parentElement.classList.remove('wrong');
                    saveProgress();
                    updateClueStatus();
                }
            }
        }

        function findWordRange(row, col, preferredDirection = STATE.activeDirection) {
            const { grid } = STATE;
            const ranges = [];

            let startCol = col;
            while (startCol > 0 && grid[row][startCol - 1] !== '#') startCol--;

            let endCol = col;
            while (endCol < grid.length - 1 && grid[row][endCol + 1] !== '#') endCol++;

            if (endCol > startCol) {
                ranges.push({ dir: 'A', direction: 'across', row, startCol, endCol });
            }

            let startRow = row;
            while (startRow > 0 && grid[startRow - 1][col] !== '#') startRow--;

            let endRow = row;
            while (endRow < grid.length - 1 && grid[endRow + 1][col] !== '#') endRow++;

            if (endRow > startRow) {
                ranges.push({ dir: 'D', direction: 'down', col, startRow, endRow });
            }

            return ranges.find(range => range.direction === preferredDirection) || ranges[0] || null;
        }

        function getInputs() {
            return [...E.grid.querySelectorAll('input[data-row]')];
        }

        // ===== Share Results =====
        function getFormattedDate(dateStr) {
            const d = new Date(dateStr + "T00:00:00");
            return d.toLocaleDateString(undefined, {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function getShareGridRows() {
            const { grid } = STATE;
            const inputsByPosition = new Map(getInputs().map(input => [
                `${input.dataset.row},${input.dataset.col}`,
                input.value.toUpperCase()
            ]));

            return grid.map((row, rowIndex) => row.map((cell, colIndex) => {
                if (cell === '#') return '⬛';

                const value = inputsByPosition.get(`${rowIndex},${colIndex}`) || '';
                if (!value) return '⬜';

                return value === cell ? '🟩' : '🟧';
            }).join(''));
        }

        function getShareStats() {
            const answerMap = getAnswerMap();
            let filled = 0;
            let correct = 0;

            for (const input of getInputs()) {
                const value = input.value.toUpperCase();
                if (!value) continue;

                filled++;
                if (value === answerMap.get(`${input.dataset.row},${input.dataset.col}`)) {
                    correct++;
                }
            }

            return { filled, correct, total: answerMap.size };
        }

        function buildShareText() {
            const appName = 'SITS & Giggles';
            const { filled, correct, total } = getShareStats();
            const rows = getShareGridRows();

            return [
                appName,
                getFormattedDate(STATE.date),
                `${correct}/${total} correct · ${filled}/${total} filled`,
                '',
                ...rows,
                '',
                window.location.href.split('#')[0]
            ].join('\n');
        }

        function setShareStatus(message, isError = false) {
            E.shareStatus.textContent = message;
            E.shareStatus.classList.toggle('error', isError);
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }

            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            const copied = document.execCommand('copy');
            textArea.remove();

            if (!copied) {
                return Promise.reject(new Error('Clipboard copy failed'));
            }

            return Promise.resolve();
        }

        async function shareResults() {
            if (!STATE.grid) return;

            const text = buildShareText();

            try {
                if (navigator.share) {
                    await navigator.share({ text });
                    setShareStatus('Shared!');
                    return;
                }

                await copyText(text);
                setShareStatus('Copied results!');
            } catch (error) {
                if (error.name === 'AbortError') return;

                console.error('Error sharing results:', error);
                setShareStatus('Could not share results.', true);
            }
        }

        // ===== Storage =====
        function saveProgress() {
            const cells = getInputs().map(input => ({
                r: +input.dataset.row,
                c: +input.dataset.col,
                v: input.value.toUpperCase()
            }));

            localStorage.setItem(storageKey(STATE.date), JSON.stringify({
                cells,
                inline: STATE.inline
            }));
        }

        function loadProgress() {
            const raw = localStorage.getItem(storageKey(STATE.date));
            if (!raw) return;

            try {
                const data = JSON.parse(raw);
                const cellMap = new Map(data.cells.map(cell => [`${cell.r},${cell.c}`, cell.v]));

                for (const input of getInputs()) {
                    const key = `${input.dataset.row},${input.dataset.col}`;
                    if (cellMap.has(key)) {
                        input.value = cellMap.get(key);
                    }
                }

                STATE.inline = !!data.inline;
                E.inlineCheck.checked = STATE.inline;

                if (STATE.inline) {
                    validateAll(false);
                }
            } catch (error) {
                console.error('Error loading progress:', error);
            }
        }

        function clearProgress() {
            localStorage.removeItem(storageKey(STATE.date));

            for (const input of getInputs()) {
                input.value = '';
                input.parentElement.classList.remove('correct', 'wrong');
            }

            updateClueStatus();
        }

        // ===== Initialization =====
        function rebuildFor(dateStr) {
            try {
                STATE.date = dateStr;
                setDateLabel(dateStr);

                const rng = seedFromDate(dateStr);
                const { grid, placements } = generate(ITEMS, rng);

                STATE.grid = grid;
                STATE.placements = placements;
                STATE.nums = numberGrid(grid);
                STATE.clues = buildClues();
                STATE.selectedCell = null;
                setShareStatus('');

                renderGrid();
                renderClues();
                loadProgress();
                updateClueStatus();
            } catch (error) {
                console.error('Error generating crossword:', error);
                // Show a simple fallback message
                const errorMessage = document.createElement('div');
                errorMessage.className = 'error-message';
                errorMessage.textContent = 'Error generating crossword. Please try again.';
                E.grid.replaceChildren(errorMessage);
                E.across.replaceChildren();
                E.down.replaceChildren();
            }
        }


        // ===== Keyboard Shortcuts =====
        function handleGlobalKeyboard(event) {
            // Only handle shortcuts when not typing in inputs
            if (event.target.tagName === 'INPUT' && !event.ctrlKey && !event.metaKey) {
                return;
            }

            if (event.ctrlKey || event.metaKey) {
                event.preventDefault();
                switch (event.key.toLowerCase()) {
                    case 'a':
                        validateAll(true);
                        break;
                    case 'r':
                        revealWrong();
                        break;
                    case 'w':
                        revealCurrentWord();
                        break;
                    case 'h':
                        hintFirstLetter();
                        break;
                    case 'l':
                        hintLastLetter();
                        break;
                    case 'c':
                        clearProgress();
                        break;
                    case 'i':
                        E.inlineCheck.checked = !E.inlineCheck.checked;
                        E.inlineCheck.dispatchEvent(new Event('change'));
                        break;
                }
            }
        }

        // ===== Event Listeners =====
        document.addEventListener('keydown', handleGlobalKeyboard);

        E.inlineCheck.addEventListener('change', () => {
            STATE.inline = E.inlineCheck.checked;
            saveProgress();

            if (STATE.inline) {
                validateAll(false);
            } else {
                for (const input of getInputs()) {
                    input.parentElement.classList.remove('correct', 'wrong');
                }
            }
        });

        E.loadDate.addEventListener('click', () => {
            if (!ITEMS.length) return;

            const dateStr = E.datePick.value || todayStr();
            rebuildFor(dateStr);
        });
        E.clearBtn.addEventListener('click', clearProgress);
        E.checkAll.addEventListener('click', () => validateAll(true));
        E.revealWrong.addEventListener('click', revealWrong);
        E.revealWord.addEventListener('click', revealCurrentWord);
        E.hintFirst.addEventListener('click', hintFirstLetter);
        E.hintLast.addEventListener('click', hintLastLetter);
        E.shareResults.addEventListener('click', shareResults);

        async function initializeApplication() {
            E.datePick.value = todayStr();
            E.loadDate.disabled = true;
            E.shareResults.disabled = true;

            try {
                await loadItems();
                E.loadDate.disabled = false;
                E.shareResults.disabled = false;
                rebuildFor(todayStr());
            } catch (error) {
                console.error('Error loading crossword data:', error);

                const errorMessage = document.createElement('div');
                errorMessage.className = 'error-message';
                errorMessage.textContent = 'Error loading crossword data. Please try again later.';
                E.grid.replaceChildren(errorMessage);
                E.across.replaceChildren();
                E.down.replaceChildren();
            }
        }

        // ===== Initialize Application =====
        initializeApplication();
    </script>
</body>
